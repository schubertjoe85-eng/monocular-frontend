<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #fff; font: 14px -apple-system, system-ui, sans-serif; overflow: hidden; -webkit-user-select: none; user-select: none; }
  #view { position: fixed; top: 0; left: 0; display: block; touch-action: none; }
  #panel { position: fixed; left: 0; right: 0; bottom: 0; background: #0b0b0b; border-top: 1px solid #262626; padding: 10px 14px calc(12px + env(safe-area-inset-bottom)); }
  #status { color: #9fb8a8; font-size: 12px; min-height: 64px; line-height: 16px; }
  .row { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
  button { flex: 1; min-width: 0; background: #222; color: #fff; border: 1px solid #333; border-radius: 12px; padding: 12px 4px; font-weight: 800; letter-spacing: .2px; font-size: 10px; }
  button[hidden], .row[hidden] { display: none; }
  button.pm { flex: 0 0 34px; padding: 12px 0; font-size: 14px; }
  .val { flex: 0 0 auto; min-width: 34px; text-align: center; font-size: 10px; font-weight: 800; color: #cfe3d6; }
  button.on { background: #2E4D3A; border-color: #2E4D3A; }
  button.primary { background: #2E4D3A; border-color: #2E4D3A; }
  button:disabled { opacity: .4; }
  #timeRow { opacity: .45; }
  #timeRow input { flex: 1; accent-color: #7FBF9A; }
  #timeLabel { color: #aaa; font-size: 11px; margin-top: 2px; }
  .scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .scroll::-webkit-scrollbar { display: none; }
  .scroll button { flex: 0 0 auto; padding: 10px 12px; }
  #overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; }
  #overlay .sel { fill: rgba(74,140,255,.25); stroke: #4a8cff; stroke-width: 3; }
  #overlay .snap { fill: none; stroke: #ff3db4; stroke-width: 2.5; }
  #snapMark { position: fixed; pointer-events: none; transform: translate(-9px, -9px); }
  #snapMark i { display: block; width: 14px; height: 14px; border: 2.5px solid #ff3db4; transform: rotate(45deg); }
  #snapMark b { position: absolute; left: 18px; top: -16px; background: #ff3db4; color: #fff; font-size: 10px; padding: 2px 5px; border-radius: 4px; }
  body.tooling #timeRow, body.tooling #timeLabel, body.tooling #editRow, body.tooling #mainRow, body.tooling #captureRow { display: none; }
  body.tooling #status { min-height: 32px; }
  #snapMark[hidden], #toolPanel[hidden], span[hidden] { display: none; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<svg id="overlay"></svg>
<div id="snapMark" hidden><i></i><b></b></div>
<div id="panel">
  <div id="status">Starting…</div>
  <div class="row" id="timeRow"><span style="font-size:12px;color:#aaa">Time</span><input id="time" type="range" min="5" max="20" step="0.25" value="10"></div>
  <div id="timeLabel"></div>
  <div class="row" id="mainRow">
    <button id="openBtn">OPEN</button>
    <button id="sketchBtn" title="Photograph a plan sketch and build the model from it">SKETCH</button>
    <button id="clayBtn">CLAY</button>
    <button id="moveBtn" title="Drag the model to its place on the site">MOVE</button>
    <button id="spinBtn" title="Rotate the model 45° on the site">SPIN</button>
    <button id="turnBtn" title="Stand a model up that came in on its side">TURN</button>
  </div>
  <div class="row" id="nudgeRow" hidden>
    <span class="val">X</span><button id="xDown" class="pm">−</button><button id="xUp" class="pm">+</button>
    <span class="val">Y</span><button id="yDown" class="pm">−</button><button id="yUp" class="pm">+</button>
    <span class="val">Z</span><button id="zDown" class="pm">−</button><button id="zUp" class="pm">+</button>
    <button id="stepBtn">STEP 100 MM</button>
  </div>
  <div class="row" id="editRow" hidden>
    <button id="stDown" class="pm">−</button><span class="val" id="stVal">1 ST</span><button id="stUp" class="pm">+</button>
    <button id="roofBtn" title="Roof shape: flat, gable, hip or skillion">FLAT ROOF</button>
    <button id="szDown" class="pm">−</button><span class="val" id="szVal">24 M</span><button id="szUp" class="pm">+</button>
    <button id="winBtn" title="Windows on the walls the sketch doesn't mark as glass or solid">WINDOWS</button>
  </div>
  <div class="row scroll" id="styleRow" hidden></div>
  <div class="row scroll" id="drawRow" hidden></div>
  <div class="row" id="toolRow" hidden>
    <button id="modBtn" title="Doors, windows, glazing, verandahs, balustrades, columns; select, move and delete any part">MODIFY</button>
    <button id="intBtn" title="Walls, doors, stairs and lifts inside, floor by floor">INTERIOR</button>
  </div>
  <div id="toolPanel" hidden>
    <div class="row scroll" id="modeRow"></div>
    <div class="row scroll" id="optRow" hidden></div>
    <div class="row">
      <span class="row" id="levelBox" style="margin:0;flex:0 0 auto" hidden><button id="lvDown" class="pm">▼</button><span class="val" id="levelVal">GROUND</span><button id="lvUp" class="pm">▲</button></span>
      <button id="allBtn" hidden>THIS FLOOR</button>
      <button id="snapBtn" class="on" title="Taps land on the nearest end, midpoint, edge or centre">SNAP</button>
      <button id="flipBtn" hidden>FLIP</button>
      <button id="turnSelBtn">TURN</button>
      <button id="doneBtn" hidden>DONE</button>
      <button id="deleteBtn">DELETE</button>
      <button id="undoBtn">UNDO</button>
    </div>
  </div>
  <div class="row" id="captureRow">
    <button id="captureBtn" disabled>QUICK CAPTURE</button>
    <button id="elevBtn" hidden title="Photograph an elevation: wall height, roof and windows">ELEVATION</button>
    <button id="renderBtn" class="primary" disabled>PHOTOREAL RENDER</button>
  </div>
</div>
<script>/*__BUNDLE__*/</script>
</body>
</html>
